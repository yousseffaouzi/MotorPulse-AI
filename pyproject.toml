[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorpulse-ai"
version = "0.1.0.dev0"
description = "Local-first synthetic industrial motor monitoring and condition simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MotorPulse AI contributors"}]
keywords = ["motor", "vibration", "simulation", "condition-monitoring", "predictive-maintenance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yousseffaouzi/MotorPulse-AI"
Source = "https://github.com/yousseffaouzi/MotorPulse-AI"
Issues = "https://github.com/yousseffaouzi/MotorPulse-AI/issues"

[project.scripts]
motorpulse-ai = "motorpulse.__main__:main"
motorpulse-export = "motorpulse.export:main"
motorpulse-ims = "motorpulse.ims:main"
motorpulse-ims-validate = "motorpulse.ims_validation:main"
motorpulse-eda = "motorpulse.eda:main"
motorpulse-split = "motorpulse.splits:main"
motorpulse-card = "motorpulse.dataset_cards:main"
motorpulse-anomaly = "motorpulse.anomaly:main"
motorpulse-evaluate = "motorpulse.evaluation:main"
motorpulse-experiment = "motorpulse.experiment:main"
motorpulse-model = "motorpulse.model_artifact:main"
motorpulse-robustness = "motorpulse.robustness:main"
motorpulse-compare = "motorpulse.comparison:main"

[tool.setuptools]
packages = ["motorpulse"]
include-package-data = true

[tool.setuptools.package-data]
motorpulse = ["web/index.html", "cards/*.json"]
