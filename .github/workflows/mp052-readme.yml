name: MP-052 README integration helper

on:
  push:
    branches:
      - chore/mp-052-container-quickstart
    paths:
      - .github/workflows/mp052-readme.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/mp-052-container-quickstart
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Patch README and run MP-052 contracts
        run: |
          python .github/scripts/mp052_readme.py
          python -m unittest tests.test_container_quickstart -v
          git diff --check
      - name: Commit tested README integration and self-remove
        run: |
          rm .github/workflows/mp052-readme.yml .github/scripts/mp052_readme.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/mp052-readme.yml .github/scripts/mp052_readme.py
          git diff --cached --check
          git commit -m 'docs(mp-052): link optional container quick start'
          git push origin HEAD:chore/mp-052-container-quickstart

# Rerun after safety assertions were corrected to test configuration semantics.
