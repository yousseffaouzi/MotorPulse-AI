name: Quality gates
# PR-only/manual checks: no duplicate feature-push or merge-push runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motorpulse-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit, API, and integration tests
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: python -m unittest discover -s tests -v

  lint-format:
    name: Lint and format changed Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned quality tool
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Ruff correctness lint and format check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
            head="HEAD"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMRT "$base" "$head" -- \
              'motorpulse/*.py' 'tests/*.py' 'scripts/*.py'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files require lint/format checks."
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          ruff check --select E4,E7,E9,F "${files[@]}"
          ruff format --check "${files[@]}"

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Enforce reviewed dependency policy
        run: python -m unittest discover -s tests -p 'test_dependency_policy.py' -v

  # Supported-version behavior is covered by the matrix above; this heavier
  # clean-install acceptance runs once on the newest supported Python.
  fresh-clone:
    name: Fresh-clone reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install, run, export, and evaluate from clean checkout
        run: python scripts/fresh_clone_smoke.py

  # Optional container path: preserve the application's loopback-only bind by
  # sharing the runner's network stack instead of introducing a 0.0.0.0 bind.
  container-quickstart:
    name: Container quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and validate Compose configuration
        run: |
          docker compose config
          docker compose build
      - name: Run localhost container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d
          trap 'docker compose down --remove-orphans' EXIT
          if ! python - <<'PY'
          import http.client
          import json
          import time
          import urllib.error
          import urllib.request

          health = "http://127.0.0.1:8765/api/health"
          deadline = time.monotonic() + 30
          while True:
              try:
                  with urllib.request.urlopen(health, timeout=2) as response:
                      payload = json.load(response)
                  if payload == {"status": "ok", "source": "simulation"}:
                      break
              except (OSError, ValueError, urllib.error.URLError):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit("container health endpoint did not become ready")
              time.sleep(0.5)

          with urllib.request.urlopen("http://127.0.0.1:8765/", timeout=3) as response:
              dashboard = response.read().decode("utf-8")
          assert "MotorPulse" in dashboard

          conn = http.client.HTTPConnection("127.0.0.1", 8765, timeout=3)
          try:
              conn.putrequest("GET", "/api/health", skip_host=True)
              conn.putheader("Host", "example.com")
              conn.endheaders()
              response = conn.getresponse()
              body = json.loads(response.read())
              assert response.status == 400, response.status
              assert body.get("code") == "invalid_host_header", body
          finally:
              conn.close()
          PY
          then
            docker compose logs --no-color
            exit 1
          fi
          docker compose ps
