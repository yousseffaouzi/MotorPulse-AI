name: Quality gates
# PR-only/manual checks: no duplicate feature-push or merge-push runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motorpulse-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit, API, and integration tests
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: python -m unittest discover -s tests -v

  lint-format:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned quality tool
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Ruff lint
        run: ruff check motorpulse tests
      - name: Ruff format check
        run: ruff format --check motorpulse tests

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Enforce reviewed dependency policy
        run: python -m unittest discover -s tests -p 'test_dependency_policy.py' -v
