name: MP-049 security linker

on:
  push:
    branches: [fix/mp-049-local-first-security]
    paths:
      - .github/workflows/mp049-link-security.yml

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mp-049-local-first-security
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Link security guide and preserve API wording
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('motorpulse/__main__.py')
          text = server.read_text(encoding='utf-8')
          old = '"error": \'{"action":"start|pause|step|reset"} is required\','
          new = '"error": \'Body must be {"action":"start|pause|step|reset"}\','
          if text.count(old) != 1:
              raise SystemExit(f'expected one control-error anchor, got {text.count(old)}')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = 'Contributor references: [localhost API](docs/API.md), [CLI tutorial](docs/CLI.md), [troubleshooting](docs/TROUBLESHOOTING.md), [architecture](docs/ARCHITECTURE.md), [configuration](docs/CONFIG_FILE.md), and [baseline model cards](docs/MODEL_CARDS.md).'
          new = 'Contributor references: [localhost API](docs/API.md), [CLI tutorial](docs/CLI.md), [troubleshooting](docs/TROUBLESHOOTING.md), [architecture](docs/ARCHITECTURE.md), [configuration](docs/CONFIG_FILE.md), [baseline model cards](docs/MODEL_CARDS.md), and [local-first security](docs/SECURITY.md).'
          if text.count(old) != 1:
              raise SystemExit(f'expected one README navigation anchor, got {text.count(old)}')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/mp049-link-security.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md motorpulse/__main__.py .github/workflows/mp049-link-security.yml
          git commit -m 'docs(mp-049): link local-first security guide'
          git push origin HEAD:fix/mp-049-local-first-security
