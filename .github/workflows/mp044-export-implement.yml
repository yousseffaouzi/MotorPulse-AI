name: MP-044 export implementation helper

on:
  push:
    branches: [feat/mp-044-export-charts-reports]
    paths:
      - .github/workflows/mp044-export-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mp-044-export-charts-reports
      - name: Apply bounded UI patch
        run: python scripts/mp044_patch.py
      - name: Commit implementation and remove helpers
        run: |
          git diff --check
          git rm .github/workflows/mp044-export-implement.yml scripts/mp044_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorpulse/web/index.html motorpulse/web/history.js
          git commit -m 'feat(mp-044): export loaded synthetic history'
          git push origin HEAD:feat/mp-044-export-charts-reports
