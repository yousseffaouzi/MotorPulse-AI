name: MP-052 evidence finalizer

on:
  push:
    branches:
      - chore/mp-052-container-quickstart
    paths:
      - .github/workflows/mp052-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/mp-052-container-quickstart
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Record verified MP-052 evidence
        run: |
          python .github/scripts/mp052_finalize.py
          python -m unittest tests.test_container_quickstart tests.test_documentation -v
          git diff --check
      - name: Commit evidence and self-remove
        run: |
          rm .github/workflows/mp052-finalize.yml .github/scripts/mp052_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md docs/TESTING.md .github/workflows/mp052-finalize.yml .github/scripts/mp052_finalize.py
          git diff --cached --check
          git commit -m 'docs(mp-052): record container quick-start evidence'
          git push origin HEAD:chore/mp-052-container-quickstart
