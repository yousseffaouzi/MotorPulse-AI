name: MP-051 README linker

on:
  push:
    branches: [release/mp-051-prep]
    paths: [.github/workflows/mp051-readme-link.yml]

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/mp-051-prep
      - name: Link release materials
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Contributor references: [localhost API](docs/API.md), [CLI tutorial](docs/CLI.md), [troubleshooting](docs/TROUBLESHOOTING.md), [architecture](docs/ARCHITECTURE.md), [configuration](docs/CONFIG_FILE.md), [baseline model cards](docs/MODEL_CARDS.md), [local-first security](docs/SECURITY.md), and the [dated synthetic benchmark](docs/BENCHMARK.md).'
          new = 'Contributor references: [localhost API](docs/API.md), [CLI tutorial](docs/CLI.md), [troubleshooting](docs/TROUBLESHOOTING.md), [architecture](docs/ARCHITECTURE.md), [configuration](docs/CONFIG_FILE.md), [baseline model cards](docs/MODEL_CARDS.md), [local-first security](docs/SECURITY.md), the [dated synthetic benchmark](docs/BENCHMARK.md), [changelog](CHANGELOG.md), and [release procedure](docs/RELEASE.md).'
          if text.count(old) != 1:
              raise SystemExit('README contributor-reference anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/mp051-readme-link.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs(mp-051): link release materials'
          git push origin HEAD:release/mp-051-prep
