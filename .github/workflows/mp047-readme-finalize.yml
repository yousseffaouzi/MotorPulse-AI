name: MP-047 README linker

on:
  push:
    branches: [docs/mp-047-api-architecture]

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/mp-047-api-architecture
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Add documentation entry points
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          anchor = 'See [docs/INSTALL.md](docs/INSTALL.md) for wheel builds, offline options, cross-directory verification, and troubleshooting.\n'
          addition = ('\nContributor references: [localhost API](docs/API.md), '
                      '[CLI tutorial](docs/CLI.md), '
                      '[troubleshooting](docs/TROUBLESHOOTING.md), '
                      '[architecture](docs/ARCHITECTURE.md), and '
                      '[configuration](docs/CONFIG_FILE.md).\n')
          if text.count(anchor) != 1:
              raise SystemExit('unexpected README install anchor')
          for target in ('docs/API.md', 'docs/CLI.md', 'docs/TROUBLESHOOTING.md'):
              if target in text:
                  raise SystemExit(f'new README link already present: {target}')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY
          git diff --check
          rm .github/workflows/mp047-readme-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/mp047-readme-finalize.yml
          git diff --cached --check
          git commit -m 'docs(mp-047): link contributor documentation'
          git push
