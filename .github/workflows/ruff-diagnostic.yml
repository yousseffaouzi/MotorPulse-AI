name: MP-045 bounded Ruff fix

on:
  push:
    branches: [chore/mp-045-quality-gates]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Apply verified changed-code fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          from pathlib import Path
          path = Path('motorpulse/comparison.py')
          text = path.read_text()
          old = '    values = _vector(event)  # validates the complete allowlisted model input\n'
          new = '    _vector(event)  # validates the complete allowlisted model input\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one validated dead assignment')
          path.write_text(text.replace(old, new))
          PY
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- 'motorpulse/*.py' 'tests/*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          ruff check --select F401 --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check --select E4,E7,E9,F "${files[@]}"
          ruff format --check "${files[@]}"
          git diff --check
          if [ -z "$(git status --porcelain -- 'motorpulse/*.py' 'tests/*.py')" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorpulse tests
          git commit -m 'style(mp-045): satisfy changed-code quality gate'
          git push
