name: MP-047 docs finalizer

on:
  push:
    branches: [docs/mp-047-api-architecture]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/mp-047-api-architecture
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Record verified MP-047 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          testing = Path('docs/TESTING.md')
          text = testing.read_text()
          old_count = 'The suite contains **466 standard-library unittest test cases**'
          new_count = 'The suite contains **471 standard-library unittest test cases**'
          if text.count(old_count) != 1:
              raise SystemExit('unexpected TESTING suite-count anchor')
          text = text.replace(old_count, new_count, 1)

          old_tail = '6 API validation/error/rollback tests from MP-043, and 2 dependency-policy tests from MP-045).'
          new_tail = '6 API validation/error/rollback tests from MP-043, 2 dependency-policy tests from MP-045, and 5 documentation-contract tests from MP-047).'
          if text.count(old_tail) != 1:
              raise SystemExit('unexpected TESTING component-count anchor')
          text = text.replace(old_tail, new_tail, 1)

          anchor = ('Implementation evidence: GitHub Actions run `38773979137` passed all six jobs. '
                    'The fresh-clone log reported `MP-046 install: ok`, `local server: ok`, '
                    '`synthetic export: ok`, `held-out evaluation: ok`, and '
                    '`MP-046 fresh-clone reproducibility: PASS`; the unchanged 466-test suite '
                    'also passed on Python 3.11, 3.12 and 3.13, with lint/format and dependency policy green.\n')
          section = '''\n## MP-047: API, configuration and architecture documentation\n\nFive standard-library documentation-contract tests in `tests/test_documentation.py` keep the contributor documentation tied to the implemented public surface. They verify README navigation, the complete localhost route table and MP-043 request limits, coverage of every installed console script, current online/offline architecture diagrams and safety boundaries, and the distinct startup-file versus HTTP configuration/error surfaces.\n\nThe consolidated entry points are `docs/API.md`, `docs/CLI.md`, `docs/TROUBLESHOOTING.md`, the refreshed `docs/ARCHITECTURE.md`, and the refreshed `docs/CONFIG_FILE.md`. Specialist guides remain the detailed source for telemetry, scenarios, history, incidents, research splits/models and local-only IMS handling. These docs make no field-validation, public-deployment, physical-control or RUL claims.\n\nImplementation evidence: GitHub Actions run `38775790658` passed all six quality jobs. The complete suite ran **471/471** on Python 3.11, 3.12 and 3.13; changed-code Ruff/format, dependency policy and fresh-clone reproducibility were also green.\n'''
          if text.count(anchor) != 1 or '## MP-047: API, configuration and architecture documentation' in text:
              raise SystemExit('unexpected TESTING MP-047 anchor/state')
          testing.write_text(text.replace(anchor, anchor + section, 1))

          todo = Path('TODO.md')
          text = todo.read_text()
          anchor = ('- MP-046 implemented: a dedicated clean-checkout Python 3.13 acceptance job '
                    'creates an isolated temporary virtual environment, installs with the documented '
                    'editable path, runs the installed loopback app from outside the checkout, exports '
                    'three deterministic synthetic runs, builds the whole-run split, trains the healthy-only '
                    'baseline and evaluates the held-out test partition. `PYTHONPATH` and user-site leakage '
                    'are disabled; no IMS/external dataset or hardware is used. GitHub Actions run '
                    '`38773979137` passed the fresh-clone job plus the 466-test 3.11/3.12/3.13 matrix, '
                    'lint/format and dependency policy.\n')
          bullet = ('\n- MP-047 implemented: added a consolidated localhost API reference, end-to-end CLI tutorial '
                    'covering every installed console command, dedicated troubleshooting guide, refreshed '
                    'online/offline architecture diagrams, and clarified local-file versus HTTP/runtime '
                    'configuration boundaries. Five documentation-contract tests pin README navigation, '
                    'routes/limits, CLI coverage, diagrams and failure surfaces. GitHub Actions run '
                    '`38775790658` passed **471/471** tests on Python 3.11/3.12/3.13 plus lint/format, '
                    'dependency policy and fresh-clone reproducibility; no runtime behavior or hardware/public-network capability was added.\n')
          if text.count(anchor) != 1 or '- MP-047 implemented:' in text:
              raise SystemExit('unexpected TODO MP-046 anchor/state')
          text = text.replace(anchor, anchor + bullet, 1)

          old_row = '| MP-047 | TODO | P1 | API/configuration/architecture documentation | Updated diagrams, schemas, CLI tutorial and troubleshooting |'
          new_row = '| MP-047 | DONE | P1 | API/configuration/architecture documentation | Updated diagrams, schemas, CLI tutorial and troubleshooting |'
          if text.count(old_row) != 1:
              raise SystemExit('unexpected MP-047 tracker row')
          todo.write_text(text.replace(old_row, new_row, 1))
          PY
          git diff --check
          rm .github/workflows/mp047-docs-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TESTING.md TODO.md .github/workflows/mp047-docs-finalize.yml
          git diff --cached --check
          git commit -m 'docs(mp-047): record documentation evidence'
          git push
