name: MP-014 formatting helper

on:
  push:
    branches: [feat/mp-014-sse-streaming]
    paths:
      - .github/workflows/mp014-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mp-014-sse-streaming
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Format only changed MP-014 Python files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.0
          ruff format motorpulse/__main__.py motorpulse/controller.py tests/test_streaming.py
          ruff check --select E4,E7,E9,F motorpulse/__main__.py motorpulse/controller.py tests/test_streaming.py
          ruff format --check motorpulse/__main__.py motorpulse/controller.py tests/test_streaming.py
          git diff --check
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/mp014-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorpulse/__main__.py motorpulse/controller.py tests/test_streaming.py
          git commit -m 'style(mp-014): format streaming changes'
          git push origin HEAD:feat/mp-014-sse-streaming
