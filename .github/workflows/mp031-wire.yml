name: MP-031 bounded wiring helper

on:
  push:
    branches:
      - feat/mp-031-cwru-adapter
    paths:
      - .github/workflows/mp031-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mp-031-cwru-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Patch exact MP-031 anchors
        run: python .github/scripts/mp031_wire.py
      - name: Run CWRU contracts
        run: |
          python -m unittest tests.test_cwru -v
          python -m compileall -q motorpulse tests/test_cwru.py
          git diff --check
      - name: Commit tested wiring and self-remove
        run: |
          rm .github/workflows/mp031-wire.yml .github/scripts/mp031_wire.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorpulse/cwru.py motorpulse/dataset_cards.py pyproject.toml .github/workflows/mp031-wire.yml .github/scripts/mp031_wire.py
          git diff --cached --check
          git commit -m 'feat(mp-031): wire CWRU reports cards and CLI'
          git push origin HEAD:feat/mp-031-cwru-adapter
