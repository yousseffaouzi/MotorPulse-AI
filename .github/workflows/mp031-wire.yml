name: MP-031 bounded wiring helper

on:
  push:
    branches: [feat/mp-031-cwru-adapter]
    paths: ['.github/workflows/mp031-wire.yml']

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mp-031-cwru-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Patch exact MP-031 anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          cwru = Path('motorpulse/cwru.py')
          text = cwru.read_text(encoding='utf-8')
          old = 'MAX_MAT_BYTES = 32 * 1024 * 1024\nMAX_DECOMPRESSED_BYTES = 64 * 1024 * 1024\n'
          new = 'MAX_MAT_BYTES = 32 * 1024 * 1024\nMAX_REPORT_BYTES = 128 * 1024\nMAX_DECOMPRESSED_BYTES = 64 * 1024 * 1024\n'
          if text.count(old) != 1:
              raise SystemExit('cwru size anchor mismatch')
          text = text.replace(old, new)
          anchor = '\n\ndef main() -> None:\n'
          if text.count(anchor) != 1:
              raise SystemExit('cwru main anchor mismatch')
          validator = r'''


def validate_cwru_report(report: object) -> dict:
    """Validate one path-free MP-031 summary before downstream use."""
    if type(report) is not dict or set(report) != {
        "report_version", "source_card_id", "source_file_name", "source_file_bytes",
        "source_file_sha256", "metadata", "series", "labels", "rights",
    }:
        raise ValueError("CWRU report keys differ from the v1 contract")
    if report["report_version"] != "1.0.0" or report["source_card_id"] != SOURCE_CARD_ID:
        raise ValueError("unsupported CWRU report version or source card")
    name = report["source_file_name"]
    if type(name) is not str or not name or name != Path(name).name or "/" in name or "\\" in name:
        raise ValueError("source_file_name must be a local basename only")
    size = report["source_file_bytes"]
    if type(size) is not int or not 128 <= size <= MAX_MAT_BYTES:
        raise ValueError("invalid CWRU source_file_bytes")
    digest = report["source_file_sha256"]
    if type(digest) is not str or len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
        raise ValueError("invalid CWRU source_file_sha256")

    metadata = report["metadata"]
    expected_metadata = set(_METADATA_KEYS) | {"experiment_type", "fault_method"}
    if type(metadata) is not dict or set(metadata) != expected_metadata:
        raise ValueError("CWRU report metadata keys differ from the v1 contract")
    if metadata["metadata_version"] != "1.0.0" or metadata["source_url"] != OFFICIAL_SOURCE_URL:
        raise ValueError("invalid CWRU report metadata provenance")
    if metadata["file_name"] != name or metadata["experiment_type"] != "seeded_fault_not_run_to_failure":
        raise ValueError("CWRU report metadata does not match source/experiment semantics")
    channel = metadata["channel_variable"]
    if type(channel) is not str or not 1 <= len(channel) <= 128 or not channel.isascii():
        raise ValueError("invalid CWRU channel_variable")
    location = metadata["bearing_location"]
    fault = metadata["fault_type"]
    diameter = metadata["fault_diameter_mils"]
    position = metadata["outer_race_position"]
    load = metadata["load_hp"]
    rate = metadata["sample_rate_hz"]
    if location not in _BEARING_LOCATIONS or fault not in _FAULT_TYPES:
        raise ValueError("invalid CWRU bearing location or fault type")
    if fault == "normal":
        if diameter is not None or metadata["fault_method"] is not None:
            raise ValueError("normal CWRU metadata must not invent a seeded fault")
    else:
        if type(diameter) is not int or diameter not in _FAULT_DIAMETERS or metadata["fault_method"] != "EDM":
            raise ValueError("invalid CWRU seeded fault metadata")
    if fault == "outer_race":
        if position not in _OUTER_POSITIONS:
            raise ValueError("outer-race CWRU report needs position metadata")
    elif position is not None:
        raise ValueError("outer-race position is invalid for this CWRU fault type")
    if type(load) is not int or not 0 <= load <= 3 or type(rate) is not int or rate not in _SAMPLE_RATES:
        raise ValueError("invalid CWRU load or sample rate")
    if rate == 48000 and location != "drive_end":
        raise ValueError("48 kHz CWRU report must be drive-end")
    if metadata["value_unit"] != "unknown":
        raise ValueError("CWRU value unit remains unverified")

    series = report["series"]
    if type(series) is not dict or set(series) != {
        "sample_count", "mean_native", "rms_native", "peak_to_peak_native",
        "crest_factor", "sample_rate_hz", "window_duration_s", "value_unit",
    }:
        raise ValueError("CWRU series keys differ from the v1 contract")
    count = series["sample_count"]
    if type(count) is not int or not 1 <= count <= MAX_VECTOR_SAMPLES:
        raise ValueError("invalid CWRU sample_count")
    for field in ("mean_native", "rms_native", "peak_to_peak_native", "crest_factor", "window_duration_s"):
        value = series[field]
        if type(value) not in (int, float) or not isfinite(value):
            raise ValueError(f"non-finite CWRU summary field: {field}")
    if series["sample_rate_hz"] != rate or series["value_unit"] != "unknown":
        raise ValueError("CWRU series sampling/unit metadata mismatch")
    if abs(series["window_duration_s"] - (count / rate)) > 1e-12:
        raise ValueError("CWRU window duration does not match samples/rate")

    labels = report["labels"]
    if type(labels) is not dict or set(labels) != {
        "seeded_fault_type", "seeded_fault_diameter_mils", "run_to_failure",
        "failure_time", "failure_probability", "remaining_useful_life",
    }:
        raise ValueError("CWRU labels keys differ from the v1 contract")
    if labels["seeded_fault_type"] != fault or labels["seeded_fault_diameter_mils"] != diameter:
        raise ValueError("CWRU labels do not match explicit metadata")
    if labels["run_to_failure"] is not False or any(
        labels[key] is not None for key in ("failure_time", "failure_probability", "remaining_useful_life")
    ):
        raise ValueError("CWRU seeded-fault records must not claim run-to-failure/RUL truth")

    rights = report["rights"]
    if rights != {
        "official_source": OFFICIAL_SOURCE_URL,
        "rights_status": "unverified_for_redistribution",
        "publication_status": "local_only_do_not_redistribute",
        "raw_or_derived_data_in_repository": False,
    }:
        raise ValueError("CWRU report rights boundary differs from the reviewed policy")
    return report
'''
          text = text.replace(anchor, validator + anchor)
          cwru.write_text(text, encoding='utf-8')

          cards = Path('motorpulse/dataset_cards.py')
          text = cards.read_text(encoding='utf-8')
          replacements = [
              (
                  'from .eda import synthetic_quality_report\n',
                  'from .cwru import (\n    MAX_REPORT_BYTES as MAX_CWRU_REPORT_BYTES,\n    SOURCE_CARD_ID as CWRU_SOURCE_CARD_ID,\n    validate_cwru_report,\n)\nfrom .eda import synthetic_quality_report\n',
              ),
              (
                  '    "ims": "ims-v1.json",\n',
                  '    "ims": "ims-v1.json",\n    "cwru": "cwru-v1.json",\n',
              ),
              (
                  '    else:\n        raise ValueError("unsupported dataset kind")\n\n\ndef template_card(kind: str) -> dict:\n',
                  '''    elif kind == "user_supplied_local_cwru_seeded_fault":\n        if card["publication_status"] != "local_only_do_not_redistribute":\n            raise ValueError("CWRU publication must remain local-only")\n        if rights.get("status") != "hold" or rights.get("derived_publication_cleared") is not False:\n            raise ValueError("CWRU redistribution rights have not been cleared")\n        if card["license"].get("license_status") != "unverified":\n            raise ValueError("CWRU source license must remain unverified")\n        if card["license"].get("dataset_specific_license") is not None:\n            raise ValueError("no verified standardized CWRU source license")\n        for key in ("sensor_quality", "health", "failure_probability", "remaining_useful_life", "window_fault_onset"):\n            if card["labels"].get(key) is not None:\n                raise ValueError(f"unsupported CWRU label must remain null: {key}")\n        if run is not None:\n            _digest(run.get("inspection_report_sha256"), "inspection_report_sha256")\n            _digest(run.get("source_file_sha256"), "source_file_sha256")\n            if run.get("source_card_id") != CWRU_SOURCE_CARD_ID:\n                raise ValueError("CWRU source card mismatch")\n            if run.get("run_to_failure") is not False:\n                raise ValueError("CWRU seeded-fault record is not run-to-failure")\n            if run.get("failure_time") is not None or run.get("remaining_useful_life") is not None:\n                raise ValueError("CWRU run card must not invent failure time or RUL")\n            if run.get("rights_status") != "unverified_for_redistribution":\n                raise ValueError("CWRU run card must preserve redistribution uncertainty")\n            if run.get("fault_type") not in ("normal", "inner_race", "ball", "outer_race"):\n                raise ValueError("invalid CWRU seeded fault type")\n            if type(run.get("sample_count")) is not int or run["sample_count"] < 1:\n                raise ValueError("invalid CWRU sample count")\n    else:\n        raise ValueError("unsupported dataset kind")\n\n\ndef template_card(kind: str) -> dict:\n''',
              ),
              (
                  '        raise ValueError("kind must be synthetic or ims")\n',
                  '        raise ValueError("kind must be synthetic, ims or cwru")\n',
              ),
              (
                  '\n\ndef main() -> None:\n',
                  '''\n\ndef cwru_run_card(inspection_json: str | Path) -> dict:\n    """Generate local-only CWRU provenance without copying measurement summaries."""\n    source = _read_strict_json(inspection_json, MAX_CWRU_REPORT_BYTES)\n    validate_cwru_report(source)\n    report_digest = _sha(_canonical_json(source).encode("utf-8"))\n    metadata = source["metadata"]\n    labels = source["labels"]\n    series = source["series"]\n    card = deepcopy(template_card("cwru"))\n    card["instance_kind"] = "run"\n    card["card_id"] += ":" + report_digest[:16]\n    card["run_provenance"] = {\n        "source_card_id": source["source_card_id"],\n        "inspection_report_sha256": report_digest,\n        "source_file_name": source["source_file_name"],\n        "source_file_sha256": source["source_file_sha256"],\n        "source_file_bytes": source["source_file_bytes"],\n        "bearing_location": metadata["bearing_location"],\n        "channel_variable": metadata["channel_variable"],\n        "fault_type": labels["seeded_fault_type"],\n        "fault_diameter_mils": labels["seeded_fault_diameter_mils"],\n        "outer_race_position": metadata["outer_race_position"],\n        "load_hp": metadata["load_hp"],\n        "sample_rate_hz": metadata["sample_rate_hz"],\n        "sample_count": series["sample_count"],\n        "run_to_failure": False,\n        "failure_time": None,\n        "remaining_useful_life": None,\n        "rights_status": "unverified_for_redistribution",\n    }\n    validate_card(card)\n    return card\n\n\ndef main() -> None:\n''',
              ),
              (
                  'description="Produce offline dataset cards; IMS cards and derivatives remain local-only")\n    parser.add_argument("--source", choices=("synthetic", "ims"), required=True)\n',
                  'description="Produce offline dataset cards; external-source cards remain local-only")\n    parser.add_argument("--source", choices=("synthetic", "ims", "cwru"), required=True)\n',
              ),
              (
                  'help="synthetic export directory OR local IMS inspection report JSON")\n',
                  'help="synthetic export directory OR local IMS/CWRU inspection report JSON")\n',
              ),
              (
                  '        if args.source == "synthetic":\n            if args.verify_files:\n                raise ValueError("--verify-files requires --source ims")\n            card = synthetic_run_card(args.input)\n        else:\n            card = ims_run_card(args.input, verify_files=args.verify_files)\n',
                  '        if args.source == "synthetic":\n            if args.verify_files:\n                raise ValueError("--verify-files requires --source ims")\n            card = synthetic_run_card(args.input)\n        elif args.source == "ims":\n            card = ims_run_card(args.input, verify_files=args.verify_files)\n        else:\n            if args.verify_files:\n                raise ValueError("--verify-files requires --source ims")\n            card = cwru_run_card(args.input)\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'dataset_cards anchor mismatch: {old[:60]!r}')
              text = text.replace(old, new)
          cards.write_text(text, encoding='utf-8')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          old = 'motorpulse-ims = "motorpulse.ims:main"\n'
          new = old + 'motorpulse-cwru = "motorpulse.cwru:main"\n'
          if text.count(old) != 1 or 'motorpulse-cwru =' in text:
              raise SystemExit('pyproject script anchor mismatch')
          pyproject.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m unittest tests.test_cwru -v
          python -m compileall -q motorpulse tests/test_cwru.py
          git diff --check
      - name: Commit tested wiring and self-remove
        run: |
          rm .github/workflows/mp031-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorpulse/cwru.py motorpulse/dataset_cards.py pyproject.toml .github/workflows/mp031-wire.yml
          git diff --cached --check
          git commit -m 'feat(mp-031): wire CWRU reports cards and CLI'
          git push origin HEAD:feat/mp-031-cwru-adapter
