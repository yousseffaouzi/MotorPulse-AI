name: MP-015 benchmark generator

# Branch-only self-removing generator. Ruff performs only its safe import fix
# before the report is regenerated and byte-verified.
on:
  push:
    branches: [docs/mp-015-demo-benchmark]
    paths:
      - .github/workflows/mp015-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/mp-015-demo-benchmark
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate and verify benchmark artifacts
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.0
          ruff check --fix --select I scripts/generate_benchmark_report.py tests/test_benchmark_report.py
          ruff format scripts/generate_benchmark_report.py tests/test_benchmark_report.py
          ruff check scripts/generate_benchmark_report.py tests/test_benchmark_report.py
          ruff format --check scripts/generate_benchmark_report.py tests/test_benchmark_report.py
          mkdir -p docs/demo
          python scripts/generate_benchmark_report.py \
            --date 2026-10-15 \
            --config docs/examples/experiment-v1.json \
            --markdown docs/BENCHMARK.md \
            --svg docs/demo/benchmark-summary.svg
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Contributor references: [localhost API](docs/API.md), [CLI tutorial](docs/CLI.md), [troubleshooting](docs/TROUBLESHOOTING.md), [architecture](docs/ARCHITECTURE.md), [configuration](docs/CONFIG_FILE.md), [baseline model cards](docs/MODEL_CARDS.md), and [local-first security](docs/SECURITY.md).'
          new = 'Contributor references: [localhost API](docs/API.md), [CLI tutorial](docs/CLI.md), [troubleshooting](docs/TROUBLESHOOTING.md), [architecture](docs/ARCHITECTURE.md), [configuration](docs/CONFIG_FILE.md), [baseline model cards](docs/MODEL_CARDS.md), [local-first security](docs/SECURITY.md), and the [dated synthetic benchmark](docs/BENCHMARK.md).'
          if text.count(old) != 1:
              raise SystemExit(f'expected one README navigation anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_benchmark_report.py' -v
          rm .github/workflows/mp015-generate.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/BENCHMARK.md docs/demo/benchmark-summary.svg \
            scripts/generate_benchmark_report.py tests/test_benchmark_report.py \
            .github/workflows/mp015-generate.yml
          git commit -m 'docs(mp-015): publish dated synthetic benchmark'
          git push origin HEAD:docs/mp-015-demo-benchmark
