name: MP-044 evidence finalizer

on:
  push:
    branches: [feat/mp-044-export-charts-reports]
    paths:
      - .github/workflows/mp044-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mp-044-export-charts-reports
      - name: Record verified MP-044 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path('docs/HISTORICAL_DASHBOARD.md')
          text = history.read_text(encoding='utf-8')
          anchor = 'Charts use CSS responsive columns, labelled form fields, focused controls, polite status updates and a data table without reliance on color alone. Motor/session names and telemetry text are inserted using DOM textContent rather than unsanitized HTML.\n\n## Implementation notes and limitations\n'
          section = '''Charts use CSS responsive columns, labelled form fields, focused controls, polite status updates and a data table without reliance on color alone. Motor/session names and telemetry text are inserted using DOM textContent rather than unsanitized HTML.\n\n### Export the loaded synthetic page\n\nAfter a successful history page load, four local export controls become available. **Export loaded page CSV** downloads exactly the currently selected, filtered and paginated rows already held by the browser; it does not request older pages or bypass the server's 100-event page bound. The CSV begins with an explicit `MotorPulse AI synthetic simulation export` marker plus the selected session, asset and page number, then records virtual UTC timestamp, vibration RMS, temperature, RPM, sensor quality and original rule health. Text cells are quoted, embedded quotes are escaped, and values beginning with `=`, `+`, `-` or `@` are prefixed with an apostrophe before download to reduce spreadsheet-formula execution risk.\n\nThe three **Download ... SVG** controls clone the already-rendered vibration, temperature or RPM chart in the browser, add a `Synthetic simulation chart` title, serialize that SVG and download it locally. The export does not create a new chart from hidden database rows, add a server endpoint, write a backend file or make an additional history request. Export controls are disabled whenever there is no successfully loaded page.\n\nThese history exports are descriptive synthetic telemetry only. Held-out model/rule evaluation reports remain the separate write-once JSON/Markdown artifacts produced by `motorpulse-evaluate` and the reproducible experiment workflow; the dashboard does not recalculate or relabel those metrics.\n\n## Implementation notes and limitations\n'''
          if text.count(anchor) != 1:
              raise SystemExit('historical dashboard insertion anchor mismatch')
          text = text.replace(anchor, section, 1)
          stale = '- This milestone does **not** introduce SSE/WebSocket streaming (MP-014), alert lifecycle acknowledgements or deduplication (MP-042), chart exports (MP-044), machine learning in the live dashboard, or RUL forecasts.'
          fresh = '- This dashboard still does **not** introduce SSE/WebSocket streaming (MP-014), machine learning in the live dashboard, unbounded database export, or RUL forecasts. Incident lifecycle review is documented separately; CSV/SVG downloads remain bounded to the currently loaded synthetic history page.'
          if text.count(stale) != 1:
              raise SystemExit('historical dashboard stale-limit anchor mismatch')
          text = text.replace(stale, fresh, 1)
          tests_old = 'Regression tests validate packaged static HTML and JavaScript, accessible SVG and table semantics, a read-only REST fetch after restart, event/session/time filtering, missing/outlier vibration fixtures, 409 fallback without persistence, responsive controls and history update hooks. When a Node.js JavaScript runtime is already available in the **test environment**, optional V8 client tests additionally execute the real chart mathematics/DOM rendering with a tiny test double to check exact microsecond spacing, missing-sensor gaps, non-interpolation, and numerical table rows.'
          tests_new = 'Regression tests validate packaged static HTML and JavaScript, accessible SVG and table semantics, a read-only REST fetch after restart, event/session/time filtering, missing/outlier vibration fixtures, 409 fallback without persistence, responsive controls, history update hooks, bounded client-side export controls and simulation labels. When a Node.js JavaScript runtime is already available in the **test environment**, optional V8 client tests additionally execute the real chart mathematics/DOM rendering plus the CSV escaping helper to check exact microsecond spacing, missing-sensor gaps, non-interpolation, numerical table rows, quote escaping and spreadsheet-formula neutralization.'
          if text.count(tests_old) != 1:
              raise SystemExit('historical dashboard tests anchor mismatch')
          text = text.replace(tests_old, tests_new, 1)
          history.write_text(text, encoding='utf-8')

          testing = Path('docs/TESTING.md')
          text = testing.read_text(encoding='utf-8')
          if text.count('The suite contains **492 standard-library unittest test cases**') != 1:
              raise SystemExit('TESTING count anchor mismatch')
          text = text.replace('The suite contains **492 standard-library unittest test cases**', 'The suite contains **498 standard-library unittest test cases**', 1)
          tail_old = '4 dated benchmark/demo tests from MP-015, and 6 community/onboarding contract tests from MP-050).'
          tail_new = '4 dated benchmark/demo tests from MP-015, 6 community/onboarding contract tests from MP-050, and 6 bounded dashboard-export tests from MP-044).'
          if text.count(tail_old) != 1:
              raise SystemExit('TESTING suite-list anchor mismatch')
          text = text.replace(tail_old, tail_new, 1)
          anchor = 'Implementation evidence: GitHub Actions run `38822843799` passed all six quality jobs. The complete suite ran **492/492** on Python 3.11, 3.12 and 3.13; changed-code Ruff/format, dependency policy and fresh-clone reproducibility were also green.\n'
          section = '''\n## MP-044: bounded synthetic history exports\n\nSix standard-library/browser contracts in `tests/test_dashboard_exports.py` pin the local dashboard export boundary. The history panel exposes one CSV download for the currently loaded filtered page and three SVG downloads for the already-rendered vibration, temperature and RPM charts. Exports are created entirely in the browser from `currentRows`; there is no `/api/export` route, no backend file write and no hidden fetch of additional history pages. Buttons stay disabled until a non-empty page is loaded.\n\nCSV output is explicitly labelled `MotorPulse AI synthetic simulation export`, includes session/asset/page metadata plus timestamp, RMS, temperature, RPM, sensor quality and rule health, and quotes cells while neutralizing leading spreadsheet-formula characters. SVG output clones the visible chart, adds a `Synthetic simulation chart` title and serializes it locally. Evaluation JSON/Markdown reports remain the existing write-once CLI/experiment artifacts rather than a browser-side recomputation.\n\nImplementation evidence: GitHub Actions run `38829188216` passed all six permanent quality jobs. The complete suite ran **498 tests** on Python 3.11, 3.12 and 3.13 (with the existing MP-015 Python-3.13-only benchmark byte-regeneration assertion skipped by design on 3.11/3.12); changed-code Ruff/format, dependency policy and fresh-clone reproducibility were also green. The MP-044 V8 test executed CSV quote escaping and formula-prefix neutralization.\n'''
          if text.count(anchor) != 1:
              raise SystemExit('TESTING MP-050 evidence anchor mismatch')
          text = text.replace(anchor, anchor + section, 1)
          testing.write_text(text, encoding='utf-8')

          todo = Path('TODO.md')
          text = todo.read_text(encoding='utf-8')
          if text.count('**Last updated:** 2026-10-15  ') != 1:
              raise SystemExit('TODO date anchor mismatch')
          text = text.replace('**Last updated:** 2026-10-15  ', '**Last updated:** 2026-10-16', 1)
          row_old = '| MP-044 | TODO | P2 | Export charts and reports | Download telemetry/evaluation reports labelled as simulation |'
          row_new = '| MP-044 | DONE | P2 | Export charts and reports | Download telemetry/evaluation reports labelled as simulation |'
          if text.count(row_old) != 1:
              raise SystemExit('TODO MP-044 row anchor mismatch')
          text = text.replace(row_old, row_new, 1)
          anchor = '- MP-050 implemented: added structured bug/feature issue forms, a PR quality/claim/provenance checklist, current contributor guidance and synthetic-only beginner tasks. Six regression contracts require reproducibility fields, protect local-first/security/data boundaries and keep starter work away from already-completed or hardware/real-data milestones. GitHub Actions run `38822843799` passed **492/492** tests on Python 3.11/3.12/3.13 plus lint/format, dependency policy and fresh-clone reproducibility.\n'
          bullet = '\n- MP-044 implemented: the recorded-history panel can download the currently loaded bounded synthetic page as formula-safe CSV and clone each visible vibration/temperature/RPM chart as a simulation-labelled SVG. Exports are browser-only, add no API route or backend write, never fetch hidden pages, and leave held-out evaluation reports to the existing write-once CLI workflow. Six regression/V8 contracts cover export state, simulation labels, SVG serialization and CSV escaping. GitHub Actions run `38829188216` passed the **498-test** supported-Python matrix plus lint/format, dependency policy and fresh-clone reproducibility.\n'
          if text.count(anchor) != 1:
              raise SystemExit('TODO MP-050 bullet anchor mismatch')
          text = text.replace(anchor, anchor + bullet, 1)
          todo.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/mp044-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HISTORICAL_DASHBOARD.md docs/TESTING.md TODO.md
          git commit -m 'docs(mp-044): record export evidence'
          git push origin HEAD:feat/mp-044-export-charts-reports
