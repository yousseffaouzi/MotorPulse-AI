name: MP-045 docs finalizer

on:
  push:
    branches: [chore/mp-045-quality-gates]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/mp-045-quality-gates
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Update verified MP-045 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          testing = Path('docs/TESTING.md')
          text = testing.read_text()

          old_count = 'The suite contains **464 standard-library unittest test cases**'
          new_count = 'The suite contains **466 standard-library unittest test cases**'
          if text.count(old_count) != 1:
              raise SystemExit('unexpected TESTING suite-count anchor')
          text = text.replace(old_count, new_count, 1)

          old_tail = "24 synthetic incident lifecycle/migration/review/UI tests from MP-042, and 6 API validation/error/rollback tests from MP-043). MP-021 was exercised locally with Python 3.13; the GitHub Actions workflow can be run manually or on PRs against `main` with Python 3.12. The complete 464-test suite passed in GitHub Actions on Python 3.12 for MP-043. Other versions are not yet verified in this milestone. No test connects to real sensors or external services."
          new_tail = "24 synthetic incident lifecycle/migration/review/UI tests from MP-042, 6 API validation/error/rollback tests from MP-043, and 2 dependency-policy tests from MP-045). MP-021 was exercised locally with Python 3.13. The GitHub Actions quality workflow runs manually or on PRs against `main` and executes the complete suite on Python 3.11, 3.12 and 3.13 with `SyntaxWarning` promoted to an error. MP-045 implementation run `38772141714` passed all 466 tests on every supported matrix version, plus the changed-code lint/format and dependency-policy jobs. No test connects to real sensors, physical equipment or external services."
          if text.count(old_tail) != 1:
              raise SystemExit('unexpected TESTING matrix-evidence anchor')
          text = text.replace(old_tail, new_tail, 1)

          section_anchor = '\nFor MP-035 portable JSON model artifacts'
          section = """
## MP-045: expanded quality gates

The PR/manual workflow runs the complete standard-library `unittest` suite on Python 3.11, 3.12 and 3.13 with `SyntaxWarning` promoted to an error. A pinned Ruff 0.17.0 gate checks correctness rules `E4`, `E7`, `E9` and `F` plus formatter compliance for Python files changed relative to the PR base (or the `main` merge base for manual runs). This is an incremental gate; it does not claim that unchanged legacy code is clean under every Ruff rule.

`tests/test_dependency_policy.py` provides a fail-closed dependency review for this zero-runtime-dependency project: runtime and optional dependencies must remain empty, and build-system requirements must exactly match the reviewed allowlist. GitHub's Dependency Review action was evaluated first, but CI proved it is unavailable while the repository Dependency graph is disabled; the workflow therefore enforces the project-native policy instead of silently skipping dependency review.

Implementation evidence: GitHub Actions run `38772141714` — 466/466 tests passed on Python 3.11, 3.12 and 3.13; changed-code lint/format and dependency-policy jobs also passed.
"""
          if text.count(section_anchor) != 1:
              raise SystemExit('unexpected TESTING section anchor')
          if '## MP-045: expanded quality gates' in text:
              raise SystemExit('MP-045 testing section already present')
          text = text.replace(section_anchor, '\n' + section + section_anchor, 1)
          testing.write_text(text)

          todo = Path('TODO.md')
          text = todo.read_text()
          milestone_anchor = '\n## Milestone 0 — Existing proof of concept'
          baseline = "\n- MP-045 implemented: PR/manual quality gates now run the full **466-test** standard-library suite across Python 3.11/3.12/3.13 with `SyntaxWarning` promoted to an error. Pinned Ruff 0.17.0 checks correctness rules `E4`/`E7`/`E9`/`F` plus formatter compliance on changed Python, and a fail-closed dependency policy preserves zero runtime/optional dependencies plus the reviewed build requirements. GitHub's Dependency Review action was evaluated but is unavailable while the repository Dependency graph is disabled. GitHub Actions run `38772141714` passed all matrix, lint/format and dependency-policy gates.\n"
          if text.count(milestone_anchor) != 1:
              raise SystemExit('unexpected TODO baseline anchor')
          if '- MP-045 implemented:' in text:
              raise SystemExit('MP-045 baseline already present')
          text = text.replace(milestone_anchor, baseline + milestone_anchor, 1)

          old_row = '| MP-045 | TODO | P1 | Expanded quality gates | Lint/format, dependency reviews, API and integration tests, supported Python matrix |'
          new_row = '| MP-045 | DONE | P1 | Expanded quality gates | Lint/format, dependency reviews, API and integration tests, supported Python matrix |'
          if text.count(old_row) != 1:
              raise SystemExit('unexpected MP-045 TODO row anchor')
          text = text.replace(old_row, new_row, 1)
          todo.write_text(text)
          PY
          git diff --check
          rm .github/workflows/mp045-docs-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TESTING.md TODO.md .github/workflows/mp045-docs-finalize.yml
          git diff --cached --check
          git commit -m 'docs(mp-045): record quality gate evidence'
          git push
