name: MP-014 SSE implementation helper

on:
  push:
    branches: [feat/mp-014-sse-streaming]
    paths:
      - .github/workflows/mp014-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/mp-014-sse-streaming
      - name: Apply bounded SSE patch
        run: python scripts/mp014_patch.py
      - name: Commit implementation and remove helpers
        run: |
          git diff --check
          git rm .github/workflows/mp014-implement.yml scripts/mp014_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motorpulse/__main__.py motorpulse/web/index.html
          git commit -m 'feat(mp-014): add localhost SSE with polling fallback'
          git push origin HEAD:feat/mp-014-sse-streaming
